<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Index - WORK FLOW - AWA</title>
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="images/sib_logo.PNG">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6b35;
            --secondary-orange: #ff8c42;
            --dark-black: #1a1a1a;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --white: #ffffff;
            --border-color: #e9ecef;
            --header-height: 70px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--header-height);
        }
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--dark-black);
            background-color: var(--white);
            overflow-x: hidden;
        }
        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            height: var(--header-height);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        .header.scrolled {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .logo h1 {
            color: var(--dark-black);
            font-weight: 600;
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: -0.3px;
        }
        .navmenu ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
            align-items: center;
        }
        .navmenu a {
            color: var(--medium-gray);
            text-decoration: none;
            font-weight: 400;
            font-size: 0.9rem;
            position: relative;
            transition: all 0.3s ease;
            padding: 0.3rem 0;
        }
        .navmenu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-orange);
            transition: width 0.3s ease;
        }
        .navmenu a:hover,
        .navmenu a.active {
            color: var(--dark-black);
        }
        .navmenu a:hover::after,
        .navmenu a.active::after {
            width: 100%;
        }
        .cta-btn {
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
            color: var(--white) !important;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.2);
            margin-left: 1rem;
        }
        .cta-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        /* Hero Section */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, var(--white) 0%, var(--light-gray) 100%);
            position: relative;
            overflow: hidden;
            padding-top: var(--header-height);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -15%;
            width: 60%;
            height: 150%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 107, 53, 0.04) 50%, transparent 70%);
            transform: rotate(15deg);
        }
        .hero-content {
            position: relative;
            z-index: 2;
        }
        .hero h2 {
            font-size: 3rem;
            font-weight: 700;
            color: var(--dark-black);
            margin-bottom: 1rem;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--medium-gray);
            margin-bottom: 2rem;
            font-weight: 300;
        }
        .btn-get-started {
            background: var(--dark-black);
            color: var(--white);
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-get-started::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn-get-started:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 26, 26, 0.2);
            color: var(--white);
        }
        .btn-get-started:hover::before {
            left: 100%;
        }
        .hero-visual {
            position: relative;
            height: 400px;
        }
        .hero-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .shape {
            position: absolute;
            border-radius: 15px;
            opacity: 0.08;
        }
        .shape-1 {
            width: 150px;
            height: 150px;
            background: var(--primary-orange);
            top: 15%;
            right: 25%;
            transform: rotate(45deg);
            animation: float 6s ease-in-out infinite;
        }
        .shape-2 {
            width: 100px;
            height: 100px;
            background: var(--dark-black);
            bottom: 25%;
            right: 15%;
            transform: rotate(-30deg);
            animation: float 8s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(45deg); }
            50% { transform: translateY(-15px) rotate(45deg); }
        }
        /* About Section */
        .about {
            padding: 4rem 0;
            background: var(--white);
        }
        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        .section-title h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark-black);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: var(--primary-orange);
            margin: 1rem auto;
            border-radius: 2px;
        }
        .about-card {
            background: var(--white);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
            height: 100%;
            transition: all 0.3s ease;
        }
        .about-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
        }
        .about-card h3 {
            color: var(--dark-black);
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        .about-card p {
            color: var(--medium-gray);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .about-visual {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--light-gray), var(--border-color));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .about-visual::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 107, 53, 0.08) 50%, transparent 70%);
        }
        .about-visual i {
            font-size: 3rem;
            color: var(--primary-orange);
            z-index: 2;
            position: relative;
        }
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-list li {
            padding: 0.8rem 0;
            color: var(--dark-black);
            font-weight: 500;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        .feature-list li:last-child {
            border-bottom: none;
        }
        .feature-list li i {
            color: var(--primary-orange);
            margin-right: 0.8rem;
            font-size: 1rem;
            width: 16px;
        }
        /* Contact/Login Section */
        .contact {
            padding: 4rem 0;
            background: var(--light-gray);
            position: relative;
        }
        .login-container {
            max-width: 450px;
            margin: 0 auto;
        }
        .login-form {
            background: var(--white);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            position: relative;
        }
        .login-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-orange));
            border-radius: 20px 20px 0 0;
        }
        .login-form h2 {
            color: var(--dark-black);
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 1.6rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        .form-label {
            color: var(--dark-black);
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: var(--white);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
            transform: translateY(-1px);
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
            border: none;
            color: var(--white);
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }
        .btn-login:hover::before {
            left: 100%;
        }
        .forgot-password {
            color: var(--medium-gray);
            text-decoration: none;
            font-size: 0.85rem;
            text-align: center;
            display: block;
            transition: color 0.3s ease;
        }
        .forgot-password:hover {
            color: var(--primary-orange);
        }
        /* Footer */
        .footer {
            background: var(--dark-black);
            color: var(--white);
            padding: 3rem 0 1.5rem;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-orange));
        }
        .footer-content {
            margin-bottom: 2rem;
        }
        .footer .sitename {
            color: var(--white);
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        .footer h4 {
            color: var(--primary-orange);
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .footer p, .footer li {
            color: #ccc;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .footer ul {
            list-style: none;
            padding: 0;
        }
        .social-links {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .social-links a {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }
        .social-links a:hover {
            background: var(--primary-orange);
            color: var(--white);
            transform: translateY(-2px);
        }
        .copyright {
            border-top: 1px solid #333;
            padding-top: 1.5rem;
            text-align: center;
            color: #999;
            font-size: 0.85rem;
        }
        /* Mobile Navigation */
        .mobile-nav-toggle {
            display: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--dark-black);
        }
        /* Responsive */
        @media (max-width: 768px) {
            .navmenu ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--white);
                box-shadow: 0 5px 20px rgba(0,0,0,0.1);
                padding: 1rem;
                gap: 0.8rem;
            }
            .navmenu ul.show {
                display: flex;
            }
            .mobile-nav-toggle {
                display: block;
            }
            .cta-btn {
                margin-left: 0;
                margin-top: 0.8rem;
                text-align: center;
                display: block;
            }
            .hero {
                min-height: 80vh;
                padding: var(--header-height) 0 2rem;
            }
            .hero h2 {
                font-size: 2.2rem;
            }
            .hero p {
                font-size: 1rem;
            }
            .hero-visual {
                height: 300px;
                margin-top: 2rem;
            }
            .login-form {
                padding: 2rem;
                margin: 0 1rem;
            }
            .section-title h2 {
                font-size: 1.8rem;
            }
            .about-card {
                padding: 1.5rem;
            }
            .about, .contact {
                padding: 3rem 0;
            }
        }
        /* Loading and Alert Styles */
        .loading {
            display: none;
        }
        .alert-custom {
            border-radius: 10px;
            border: none;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .alert-success {
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.1), rgba(40, 167, 69, 0.05));
            color: #28a745;
            border-left: 3px solid #28a745;
        }
        .alert-danger {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.1), rgba(220, 53, 69, 0.05));
            color: #dc3545;
            border-left: 3px solid #dc3545;
        }
        .spinner-border {
            color: var(--white);
        }
    </style>

    <!-- Compléments au CSS legacy (popup, modales, menu) -->
    <link rel="stylesheet" href="static/css/app.css">

    <script type="importmap">
    { "imports": { "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js" } }
    </script>
</head>

<body class="index-page">
    <div id="app"></div>
    <script type="module">
        import { createApp } from "vue";
        import LoginPage from "./static/js/pages/LoginPage.js";
        const app = createApp(LoginPage);
        // Conserve les espaces entre éléments en ligne, comme le HTML legacy
        app.config.compilerOptions.whitespace = "preserve";
        app.mount("#app");
    </script>
</body>
</html>
